<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Mood — ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --dark:#1E1A15; --dark2:#2a231c; --gold:#B8975A; --gold-dim:#8f7546; --cream:#F3EFEA;
    --muted:#6B5E4E; --green:#2C5F3A; --red:#c0392b; --white:#ffffff; --border:#e7e0d4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Cairo',sans-serif; background:var(--cream); color:var(--dark); display:flex; min-height:100vh; overflow-x:hidden; }
  .mono{ font-family:'IBM Plex Mono', monospace; direction:ltr; }

  .sidebar{ width:235px; background:var(--dark); color:#f0e6d8; flex-shrink:0; display:flex; flex-direction:column; padding:22px 0; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .brand{ text-align:center; margin-bottom:22px; padding:0 14px; }
  .brand .logo{ width:54px; height:54px; border-radius:14px; background:linear-gradient(155deg,var(--gold),var(--gold-dim)); color:var(--dark); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:19px; margin:0 auto 10px; font-family:'IBM Plex Mono',monospace; }
  .brand h1{ font-size:16px; font-weight:800; letter-spacing:.5px; }
  .brand p{ font-size:10.5px; color:var(--gold); margin-top:3px; letter-spacing:.5px; }
  .nav{ flex:1; display:flex; flex-direction:column; gap:2px; padding:0 10px; }
  .nav button{ all:unset; cursor:pointer; padding:11px 14px; border-radius:8px; font-size:13.5px; color:#cbbfae; display:flex; align-items:center; gap:9px; transition:.15s; font-family:inherit; }
  .nav button:hover{ background:var(--dark2); color:#fff; }
  .nav button.active{ background:var(--gold); color:var(--dark); font-weight:700; }
  .nav .icon{ font-size:15px; width:18px; text-align:center; }
  .nav .sep{ height:1px; background:#3a3129; margin:10px 12px; }

  .main{ flex:1; padding:26px 34px; max-width:100%; }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; flex-wrap:wrap; gap:10px;}
  .topbar h2{ font-size:23px; font-weight:800; }
  .topbar p{ color:var(--muted); font-size:13px; margin-top:3px; }
  .badge-live{ background:#e6f4ea; color:var(--green); font-size:12px; font-weight:700; padding:6px 14px; border-radius:20px; white-space:nowrap; }

  .cards{ display:grid; grid-template-columns:repeat(auto-fit, minmax(185px,1fr)); gap:14px; margin-bottom:22px; }
  .card{ background:var(--white); border:1px solid var(--border); border-radius:12px; padding:17px; text-align:center; }
  .card .label{ color:var(--muted); font-size:12px; font-weight:600; margin-bottom:7px; }
  .card .value{ font-size:22px; font-weight:800; }
  .card .value.green{ color:var(--green); } .card .value.red{ color:var(--red); } .card .value.gold{ color:var(--gold-dim); }

  .panel{ background:var(--white); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:20px; }
  .panel h3{ font-size:15px; font-weight:700; margin-bottom:14px; border-right:4px solid var(--gold); padding-right:10px; display:flex; justify-content:space-between; align-items:center; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ background:var(--dark); color:#fff; padding:9px 8px; text-align:center; font-weight:600; }
  td{ padding:8px 8px; text-align:center; border-bottom:1px solid var(--border); }
  tr:nth-child(even) td{ background:#fbf9f5; }
  .tbl-wrap{ overflow-x:auto; }
  .empty{ text-align:center; color:var(--muted); padding:24px; font-size:13px; }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media(max-width:980px){ .grid2{ grid-template-columns:1fr; } }
  @media(max-width:820px){ .sidebar{ width:64px; } .brand h1,.brand p,.nav span.label{ display:none; } .main{ padding:18px 14px; } }

  form .field{ margin-bottom:13px; }
  form label{ display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:5px; }
  form select, form input, form textarea{ width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-size:13.5px; font-family:inherit; background:#fdfcfa; }
  form select:focus, form input:focus, form textarea:focus{ outline:none; border-color:var(--gold); }
  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .form-row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .btn{ display:inline-block; padding:10px 22px; border:none; border-radius:8px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn-primary{ background:var(--gold); color:var(--dark); }
  .btn-primary:hover{ background:var(--gold-dim); color:#fff; }
  .btn-primary:disabled{ opacity:.55; cursor:not-allowed; }
  .btn-outline{ background:transparent; border:1px solid var(--border); color:var(--muted); }
  .btn-outline:hover{ border-color:var(--gold); color:var(--dark); }
  .btn-sm{ padding:5px 11px; font-size:12px; border-radius:6px; }
  .btn-danger{ background:#fbe2e2; color:var(--red); border:none; }
  .msg{ font-size:13px; margin-top:10px; padding:9px 12px; border-radius:8px; display:none; }
  .msg.ok{ background:#e6f4ea; color:var(--green); display:block; }
  .msg.err{ background:#fbe2e2; color:var(--red); display:block; }

  .filters{ display:flex; gap:9px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
  .filters select, .filters input{ padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:13px; font-family:inherit; }
  .pill{ display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
  .pill.dep{ background:#e6f4ea; color:var(--green); } .pill.exp{ background:#fbe2e2; color:var(--red); }

  .spinner{ display:inline-block; width:13px; height:13px; border:2px solid #ffffff55; border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:6px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-row{ text-align:center; color:var(--muted); padding:34px; font-size:13px; }

  .dyn-row{ display:grid; grid-template-columns:2fr 1fr 1fr 1fr auto; gap:8px; margin-bottom:8px; align-items:center; }
  .dyn-row.labor{ grid-template-columns:2fr 1fr 1fr auto; }
  .dyn-add{ margin-top:4px; }
  .subtotal-line{ display:flex; justify-content:space-between; font-size:13.5px; padding:8px 4px; border-top:1px dashed var(--border); margin-top:6px; }
  .subtotal-line b{ color:var(--dark); }
  .quick-links{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .setup-note{ background:#fff8e6; border:1px solid #f0dca0; color:#7a5e12; padding:12px 16px; border-radius:8px; font-size:13px; margin-bottom:18px; }

  .login-wrap{
    min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center;
    background:
      linear-gradient(155deg, rgba(30,26,21,.88), rgba(30,26,21,.72) 45%, rgba(30,26,21,.92)),
      url('login-bg.jpg') center/cover no-repeat fixed;
    position:relative;
  }
  .login-box{ width:100%; max-width:340px; background:rgba(255,255,255,.97); backdrop-filter:blur(6px); border-radius:14px; padding:30px 28px; box-shadow:0 20px 60px rgba(0,0,0,.55); position:relative; z-index:1; }
  .login-box .logo{ width:54px; height:54px; border-radius:14px; background:linear-gradient(155deg,var(--gold),var(--gold-dim)); color:var(--dark); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:19px; margin:0 auto 12px; font-family:'IBM Plex Mono',monospace; }
  .login-box h1{ text-align:center; font-size:17px; font-weight:800; margin-bottom:2px; }
  .login-box p.sub{ text-align:center; font-size:11.5px; color:var(--gold-dim); margin-bottom:20px; letter-spacing:.5px; }
  #appRoot{ display:none; width:100%; }
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="logo">LM</div>
    <h1>Living Mood</h1>
    <p class="sub">نظام إدارة المصنع — ERP</p>
    <form id="loginForm">
      <div class="field"><label>اسم المستخدم</label><input id="l_name" required autocomplete="username"></div>
      <div class="field"><label>كلمة المرور</label><input type="password" id="l_pass" required autocomplete="current-password"></div>
      <button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%;">دخول</button>
      <div class="msg" id="loginMsg"></div>
    </form>
  </div>
</div>

<div id="appRoot">
<div class="sidebar">
  <div class="brand">
    <div class="logo">LM</div>
    <h1>Living Mood</h1>
    <p>نظام إدارة المصنع — ERP</p>
  </div>
  <div class="nav" id="nav">
    <button data-page="dashboard" class="active"><span class="icon">&#9679;</span><span class="label">نظرة عامة</span></button>
    <button data-page="employees"><span class="icon">&#128100;</span><span class="label">الموظفين</span></button>
    <button data-page="logHours"><span class="icon">&#9200;</span><span class="label">ساعات وسهرات</span></button>
    <button data-page="distribution"><span class="icon">&#128202;</span><span class="label">توزيع تكلفة المرتبات</span></button>
    <div class="sep"></div>
    <button data-page="treasury"><span class="icon">&#128176;</span><span class="label">الخزنة (Cash Flow)</span></button>
    <button data-page="projects"><span class="icon">&#128188;</span><span class="label">المشاريع</span></button>
    <button data-page="products"><span class="icon">&#128736;&#65039;</span><span class="label">تكلفة المنتجات</span></button>
    <button data-page="fixedExp"><span class="icon">&#128203;</span><span class="label">المصاريف الثابتة</span></button>
    <div class="sep"></div>
    <button data-page="quotation"><span class="icon">&#128221;</span><span class="label">عروض الأسعار</span></button>
    <button data-page="debtors"><span class="icon">&#128184;</span><span class="label">المستحقات (الدائنون)</span></button>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <div>
      <h2 id="pageTitle">نظرة عامة</h2>
      <p id="pageSub">ملخص شامل لكل حاجة في المصنع</p>
    </div>
    <div class="badge-live" id="liveBadge">متصل</div>
  </div>
  <div id="content"><div class="loading-row">جاري التحميل...</div></div>
</div>
</div>

<script>
/* ============ ⚠️ اضبط رابط الـ Web App هنا بعد النشر (Deploy) ============ */
const API_URL = 'https://script.google.com/macros/s/AKfycbzstJuI5EKdabQmOIechewiCvCnJ2MEHgDubQMFRmZPqqZG7rBByy6OUrfLEIV9zl7U/exec';

/* ================= API helper ================= */
async function apiGet(action, params) {
  params = params || {};
  const qs = new URLSearchParams({ action, ...Object.fromEntries(Object.entries(params).map(([k,v]) => [k, typeof v === 'object' ? JSON.stringify(v) : v])) });
  const res = await fetch(API_URL + '?' + qs.toString());
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}
async function apiPost(action, payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // بيتفادى CORS preflight
    body: JSON.stringify({ action, ...payload })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}
function fmt(n){ return (Number(n)||0).toLocaleString('en-US', {maximumFractionDigits:0}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function weekAgoStr(){ const d=new Date(); d.setDate(d.getDate()-7); return d.toISOString().slice(0,10); }
function checkApiConfigured(){
  if (API_URL.indexOf('PASTE_YOUR') === 0) {
    document.getElementById('liveBadge').textContent = 'مش متصل';
    document.getElementById('liveBadge').style.background = '#fbe2e2';
    document.getElementById('liveBadge').style.color = '#c0392b';
    document.getElementById('content').innerHTML = `<div class="setup-note">
      ⚠️ لازم الأول تحط رابط الـ Web App بتاع الـ Apps Script في المتغيّر <code>API_URL</code> فوق في الكود، بعد ما تعمل Deploy &gt; New deployment &gt; Web app (Execute as: Me, Who has access: Anyone).
    </div>`;
    return false;
  }
  return true;
}

/* ================= Router ================= */
const PAGES = {
  dashboard:    { title:'نظرة عامة', sub:'ملخص شامل لكل حاجة في المصنع', render: renderDashboard },
  employees:    { title:'الموظفين', sub:'من شيت "تفاصيل المرتبات" بتاع الشهر الحالي مباشرة', render: renderEmployees },
  logHours:     { title:'ساعات وسهرات', sub:'سجّل شغل أي صنايعي على أي مشروع', render: renderLogHours },
  distribution: { title:'توزيع تكلفة المرتبات', sub:'مين شغل فين، وكام ساعة، وسهر إمتى', render: renderDistribution },
  treasury:     { title:'الخزنة — Cash Flow', sub:'الرصيد الحالي، الداخل والخارج، الإيداعات والمصاريف', render: renderTreasury },
  projects:     { title:'المشاريع', sub:'تكلفة كل مشروع بالتفصيل', render: renderProjects },
  products:     { title:'تكلفة المنتجات', sub:'خامات + عمالة لكل منتج، بتتحمّل على المشروع', render: renderProducts },
  fixedExp:     { title:'المصاريف الثابتة', sub:'إيجار / كهرباء / إلخ — وطريقة توزيعها على المشاريع', render: renderFixedExp },
  quotation:    { title:'عروض الأسعار', sub:'قائمة العملاء وعروض الأسعار', render: renderQuotation },
  debtors:      { title:'المستحقات (الدائنون)', sub:'متابعة تحصيل الدفعات من العملاء', render: renderDebtors }
};

document.getElementById('nav').addEventListener('click', e => {
  const btn = e.target.closest('button'); if (!btn) return; goTo(btn.dataset.page);
});
function goTo(page) {
  if (!PAGES[page]) page = 'dashboard';
  sessionStorage.setItem('lm_currentPage', page);
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  document.getElementById('pageTitle').textContent = PAGES[page].title;
  document.getElementById('pageSub').textContent = PAGES[page].sub;
  if (!checkApiConfigured()) return;
  document.getElementById('content').innerHTML = '<div class="loading-row">جاري التحميل...</div>';
  PAGES[page].render();
}
function showError(err){ document.getElementById('content').innerHTML = `<div class="panel"><div class="msg err" style="display:block;">حصل خطأ: ${err.message||err}</div></div>`; }

/* ================= Dashboard ================= */
async function renderDashboard() {
  try {
    const d = await apiGet('getDashboardData');
    document.getElementById('content').innerHTML = `
      <div class="cards">
        <div class="card"><div class="label">عدد الموظفين</div><div class="value">${d.employeesCount}</div></div>
        <div class="card"><div class="label">عدد المشاريع</div><div class="value">${d.projectsCount}</div></div>
        <div class="card"><div class="label">رصيد الخزنة</div><div class="value green">${fmt(d.treasuryBalance)} ج</div></div>
        <div class="card"><div class="label">إجمالي تكلفة العمالة</div><div class="value gold">${fmt(d.totalLaborCost)} ج</div></div>
        <div class="card"><div class="label">إجمالي ساعات الشغل</div><div class="value">${fmt(d.totalLaborHours)} س</div></div>
        <div class="card"><div class="label">تكلفة المنتجات (خامات)</div><div class="value gold">${fmt(d.totalProductsCost)} ج</div></div>
      </div>
      <div class="grid2">
        <div class="panel"><h3>أعلى 5 مشاريع في التكلفة</h3>
          ${d.topProjectsByCost.length ? `<div class="tbl-wrap"><table><thead><tr><th>المشروع</th><th>الساعات</th><th>التكلفة</th></tr></thead>
          <tbody>${d.topProjectsByCost.map(p=>`<tr><td>${p.project}</td><td>${fmt(p.hours)}</td><td>${fmt(p.cost)} ج</td></tr>`).join('')}</tbody></table></div>`
          : `<div class="empty">لا يوجد بيانات ساعات مسجلة بعد</div>`}
        </div>
        <div class="panel"><h3>آخر سجلات الساعات</h3>
          ${d.recentHoursEntries.length ? `<div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>الموظف</th><th>المشروع</th><th>التكلفة</th></tr></thead>
          <tbody>${d.recentHoursEntries.map(l=>`<tr><td>${l.date}</td><td>${l.employee}</td><td>${l.project}</td><td>${fmt(l.cost)} ج</td></tr>`).join('')}</tbody></table></div>`
          : `<div class="empty">لا يوجد سجلات بعد</div>`}
        </div>
      </div>
      <div class="panel"><h3>آخر حركات الخزنة</h3>
        ${d.recentTreasuryMoves.length ? `<div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>البيان</th><th>النوع</th><th>المشروع</th><th>المبلغ</th><th>الرصيد بعدها</th></tr></thead>
        <tbody>${d.recentTreasuryMoves.map(m=>`<tr><td>${m.date}</td><td>${m.desc}</td><td><span class="pill ${m.type==='إيداع'?'dep':'exp'}">${m.type}</span></td><td>${m.project||'—'}</td><td style="color:${m.type==='إيداع'?'var(--green)':'var(--red)'}">${fmt(m.amount)} ج</td><td>${fmt(m.balanceAfter)} ج</td></tr>`).join('')}</tbody></table></div>`
        : `<div class="empty">مفيش حركات مسجلة</div>`}
      </div>
    `;
  } catch(err){ showError(err); }
}

/* ================= Employees ================= */
async function renderEmployees() {
  try {
    const { employees } = await apiGet('listEmployees');
    document.getElementById('content').innerHTML = `
      <div class="grid2">
        <div class="panel">
          <h3>إضافة / تعديل موظف</h3>
          <form id="empForm">
            <input type="hidden" id="e_originalName">
            <div class="field"><label>اسم الموظف</label><input id="e_name" required></div>
            <div class="form-row">
              <div class="field"><label>طريقة القبض</label>
                <select id="e_paymentType"><option value="اسبوعي">اسبوعي</option><option value="شهري">شهري</option></select>
              </div>
              <div class="field"><label>اليومية (ج)</label><input type="number" id="e_dailyRate" step="1" min="0"></div>
            </div>
            <div class="form-row">
              <div class="field"><label>أجر الساعة (ج)</label><input type="number" id="e_hourlyRate" step="1" min="0"></div>
              <div class="field"><label>ملاحظات</label><input id="e_notes"></div>
            </div>
            <button type="submit" class="btn btn-primary" id="empSubmitBtn">حفظ الموظف</button>
            <button type="button" class="btn btn-outline" id="empResetBtn">إضافة جديد</button>
            <div class="msg" id="empMsg"></div>
          </form>
        </div>
        <div class="panel">
          <h3>قائمة الموظفين (${employees.length})</h3>
          <div class="tbl-wrap"><table>
            <thead><tr><th>الاسم</th><th>طريقة القبض</th><th>اليومية</th><th>أجر الساعة</th><th>قبض الاسبوع</th><th>قبض الشهر</th><th></th></tr></thead>
            <tbody>${employees.length ? employees.map(e => `<tr>
              <td>${e.name}</td><td>${e.paymentType}</td><td>${fmt(e.dailyRate)} ج</td><td>${fmt(e.hourlyRate)} ج</td><td>${fmt(e.weeklyPay)} ج</td><td>${fmt(e.monthlyPay)} ج</td>
              <td><button class="btn btn-sm btn-outline" onclick='editEmployee(${JSON.stringify(e).replace(/'/g,"&#39;")})'>تعديل</button>
                  <button class="btn btn-sm btn-danger" onclick="deleteEmployeeConfirm('${e.name.replace(/'/g,"\\'")}')">حذف</button></td>
            </tr>`).join('') : `<tr><td colspan="7" class="empty">مفيش موظفين مسجلين في شيت المرتبات</td></tr>`}</tbody>
          </table></div>
        </div>
      </div>
    `;
    document.getElementById('empResetBtn').addEventListener('click', () => resetEmployeeForm());
    document.getElementById('empForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('empSubmitBtn'); const msg = document.getElementById('empMsg');
      msg.className='msg'; msg.textContent=''; btn.disabled=true; btn.innerHTML = '<span class="spinner"></span>جاري الحفظ...';
      const originalName = document.getElementById('e_originalName').value;
      const employee = {
        id: originalName || undefined, name: document.getElementById('e_name').value.trim(),
        paymentType: document.getElementById('e_paymentType').value,
        dailyRate: document.getElementById('e_dailyRate').value, hourlyRate: document.getElementById('e_hourlyRate').value,
        notes: document.getElementById('e_notes').value
      };
      try {
        const res = originalName ? await apiPost('updateEmployee', { employee }) : await apiPost('addEmployee', { employee });
        msg.className='msg ok'; msg.textContent = 'تم الحفظ بنجاح';
        renderEmployees();
      } catch(err){ msg.className='msg err'; msg.textContent = 'خطأ: '+(err.message||err); }
      finally { btn.disabled=false; btn.textContent='حفظ الموظف'; }
    });
  } catch(err){ showError(err); }
}
function resetEmployeeForm(){
  document.getElementById('e_originalName').value='';
  document.getElementById('empForm').reset();
}
function editEmployee(e){

function renderDynRows(){
  document.getElementById('materialsBox').innerHTML = materialRows.map((m,i) => `
    <div class="dyn-row">
      <input placeholder="اسم المادة" value="${m.name}" oninput="materialRows[${i}].name=this.value; updateProdTotal();">
      <input type="number" placeholder="الكمية" value="${m.qty}" oninput="materialRows[${i}].qty=this.value; updateProdTotal();">
      <input placeholder="الوحدة" value="${m.unit}" oninput="materialRows[${i}].unit=this.value;">
      <input type="number" placeholder="سعر الوحدة" value="${m.unitPrice}" oninput="materialRows[${i}].unitPrice=this.value; updateProdTotal();">
      <button type="button" class="btn btn-sm btn-danger" onclick="materialRows.splice(${i},1); renderDynRows();">✕</button>
    </div>`).join('');
  document.getElementById('laborBox').innerHTML = laborRows.map((l,i) => `
    <div class="dyn-row labor">
      <select onchange="laborRows[${i}].employee=this.value; updateProdTotal();"><option value="">اختار الموظف</option>${(window._empOptionsHtml||'').replace(`value="${l.employee}"`, `value="${l.employee}" selected`)}</select>
      <input type="number" placeholder="ساعات" value="${l.hours}" oninput="laborRows[${i}].hours=this.value; updateProdTotal();">
      <span></span>
      <button type="button" class="btn btn-sm btn-danger" onclick="laborRows.splice(${i},1); renderDynRows();">✕</button>
    </div>`).join('');
  updateProdTotal();
}
async function updateProdTotal(){
  const matTotal = materialRows.reduce((s,m)=>s+(Number(m.qty)||0)*(Number(m.unitPrice)||0),0);
  document.querySelector('#prodTotals b').textContent = fmt(matTotal) + ' ج (خامات — العمالة بتتحسب وقت الحفظ)';
}

          <h3>إضافة مصروف ثابت</h3>
          <form id="fxForm">
            <div class="field"><label>اسم المصروف</label><input id="fx_name" required placeholder="مثال: إيجار المصنع"></div>
            <div class="field"><label>المبلغ الشهري (ج)</label><input type="number" id="fx_amount" step="1" min="0" required></div>
            <div class="field"><label>ملاحظات</label><input id="fx_notes"></div>
            <button type="submit" class="btn btn-primary" id="fxBtn">حفظ</button>
            <div class="msg" id="fxMsg"></div>
          </form>
          <h3 style="margin-top:18px;">القائمة</h3>
          <div class="tbl-wrap"><table><thead><tr><th>الاسم</th><th>المبلغ الشهري</th><th></th></tr></thead>
          <tbody>${items.length ? items.map(i=>`<tr><td>${i.name}</td><td>${fmt(i.amount)} ج</td><td><button class="btn btn-sm btn-danger" onclick="deleteFixedExpConfirm('${i.id}')">حذف</button></td></tr>`).join('') : `<tr><td colspan="3" class="empty">مفيش مصاريف ثابتة مسجلة</td></tr>`}</tbody></table></div>
        </div>
        <div class="panel">
          <h3>توزيع المصاريف الثابتة على المشاريع</h3>
          <p style="font-size:12.5px;color:var(--muted);margin-bottom:12px;">بيتوزع نسبيًا على حسب تكلفة عمالة كل مشروع (لو مفيش عمالة مسجلة، بيتوزع بالتساوي).</p>
          ${dist.distribution.length ? `<div class="tbl-wrap"><table><thead><tr><th>المشروع</th><th>النسبة</th><th>المبلغ المخصص</th></tr></thead>
          <tbody>${dist.distribution.map(d=>`<tr><td>${d.project}</td><td>${(d.weight*100).toFixed(1)}%</td><td>${fmt(d.allocated)} ج</td></tr>`).join('')}</tbody></table></div>`
          : `<div class="empty">أضف مصاريف ثابتة ومشاريع الأول عشان يظهر التوزيع</div>`}
        </div>
      </div>
    `;
    document.getElementById('fxForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('fxBtn'); const msg = document.getElementById('fxMsg');
      msg.className='msg'; msg.textContent=''; btn.disabled=true; btn.innerHTML='<span class="spinner"></span>جاري الحفظ...';
      const item = { name: document.getElementById('fx_name').value.trim(), amount: document.getElementById('fx_amount').value, notes: document.getElementById('fx_notes').value };
      try { await apiPost('addFixedExpense', { item }); renderFixedExp(); }
      catch(err){ msg.className='msg err'; msg.textContent='خطأ: '+(err.message||err); btn.disabled=false; btn.textContent='حفظ'; }
    });
  } catch(err){ showError(err); }
}
async function deleteFixedExpConfirm(id){
  if (!confirm('متأكد؟')) return;
  try { await apiPost('deleteFixedExpense', { id }); renderFixedExp(); } catch(err){ alert('خطأ: '+(err.message||err)); }
}

/* ================= Quotation ================= */
async function renderQuotation() {
  try {
    const { customers } = await apiGet('quoteListCustomers');
    document.getElementById('content').innerHTML = `
      <div class="panel">
        <h3>عميل جديد</h3>
        <form id="qNewForm" class="form-row3">
          <input id="q_name" placeholder="اسم العميل" required>
          <input id="q_phone" placeholder="الهاتف">
          <input id="q_engineer" placeholder="موجه إلى (مهندس)">
        </form>
        <div class="form-row" style="margin-top:10px;">
          <input id="q_address" placeholder="العنوان / المشروع">
          <button class="btn btn-primary" id="qCreateBtn" form="qNewForm">إنشاء عميل جديد</button>
        </div>
        <div class="msg" id="qMsg"></div>
      </div>
      <div class="panel">
        <h3>قائمة العملاء (${customers.length})</h3>
        ${customers.length ? `<div class="tbl-wrap"><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>موجه إلى</th><th>العنوان</th><th>التاريخ</th><th></th></tr></thead>
        <tbody>${customers.map(c=>`<tr><td>${c.name}</td><td>${c.phone||'—'}</td><td>${c.engineer||'—'}</td><td>${c.address||'—'}</td><td>${c.date||'—'}</td>
          <td><button class="btn btn-sm btn-danger" onclick="deleteQuoteCustomerConfirm('${c.name.replace(/'/g,"\\'")}')">حذف</button></td></tr>`).join('')}</tbody></table></div>`
        : `<div class="empty">مفيش عملاء لسه</div>`}
        <p style="font-size:12px;color:var(--muted);margin-top:10px;">✏️ تفاصيل بنود عرض السعر (المنتجات/الأسعار/الخصم) بتتحرر مباشرة في شيت العميل نفسه داخل ملف الكوتيشن.</p>
      </div>
    `;
    document.getElementById('qNewForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('qMsg'); msg.className='msg'; msg.textContent='';
      try {
        await apiPost('quoteCreateCustomer', { name: document.getElementById('q_name').value.trim(), phone: document.getElementById('q_phone').value, engineer: document.getElementById('q_engineer').value, address: document.getElementById('q_address').value });
        msg.className='msg ok'; msg.textContent='تم إنشاء العميل'; renderQuotation();
      } catch(err){ msg.className='msg err'; msg.textContent='خطأ: '+(err.message||err); }
    });
  } catch(err){ showError(err); }
}
async function deleteQuoteCustomerConfirm(name){
  if (!confirm('متأكد إنك عاوز تمسح "'+name+'"؟')) return;
  try { await apiPost('quoteDeleteCustomer', { name }); renderQuotation(); } catch(err){ alert('خطأ: '+(err.message||err)); }
}

/* ================= Debtors / Payment Statement ================= */
async function renderDebtors() {
  try {
    const { customers } = await apiGet('payListCustomers');
    const totalDue = customers.reduce((s,c)=>s+(c.total-c.received),0);
    document.getElementById('content').innerHTML = `
      <div class="cards">
        <div class="card"><div class="label">عدد العملاء</div><div class="value">${customers.length}</div></div>
        <div class="card"><div class="label">إجمالي المستحقات (المتبقي)</div><div class="value red">${fmt(totalDue)} ج</div></div>
      </div>
      <div class="panel">
        <h3>العملاء والمستحقات</h3>
        ${customers.length ? `<div class="tbl-wrap"><table><thead><tr><th>العميل</th><th>الإجمالي</th><th>المستلم</th><th>الباقي</th><th>الحالة</th><th></th></tr></thead>
        <tbody>${customers.map(c=>`<tr><td>${c.name}</td><td>${fmt(c.total)} ج</td><td>${fmt(c.received)} ج</td><td style="color:${(c.total-c.received)>0.01?'var(--red)':'var(--green)'}">${fmt(c.total-c.received)} ج</td>
          <td>${c.completed?'<span class="pill dep">مكتمل</span>':'<span class="pill exp">جاري</span>'}</td>
          <td><button class="btn btn-sm btn-danger" onclick="deleteDebtorConfirm('${c.name.replace(/'/g,"\\'")}')">حذف</button></td></tr>`).join('')}</tbody></table></div>`
        : `<div class="empty">مفيش عملاء مسجلين</div>`}
        <p style="font-size:12px;color:var(--muted);margin-top:10px;">✏️ تسجيل الدفعات الجديدة بيتم مباشرة من شيت العميل في ملف "الدائنون / المستحقات".</p>
      </div>
    `;
  } catch(err){ showError(err); }
}
async function deleteDebtorConfirm(name){
  if (!confirm('متأكد إنك عاوز تمسح "'+name+'"؟')) return;
  try { await apiPost('payDeleteCustomer', { name }); renderDebtors(); } catch(err){ alert('خطأ: '+(err.message||err)); }
}

/* ================= Login ================= */
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('loginMsg');
  msg.className = 'msg'; msg.textContent = '';
  const name = document.getElementById('l_name').value.trim();
  const pass = document.getElementById('l_pass').value.trim();
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>جاري الدخول...';
  try {
    await apiGet('login', { name, pass }); // apiGet بيرمي Error لو data.error موجودة
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('appRoot').style.display = 'block';
    goTo(sessionStorage.getItem('lm_currentPage') || 'dashboard');
  } catch (err) {
    msg.className = 'msg err'; msg.textContent = 'خطأ: ' + (err.message || err);
    btn.disabled = false; btn.textContent = 'دخول';
  }
});

/* ================= Init ================= */
document.getElementById('l_name').focus();
</script>
</body>
</html>
